# FINAL RECOVERY PLAN - Step 1: Kubernetes HostPath Force Mount
# This patch FORCES the direct mapping: /data/shared-projects (host) -> /app/projects (container)
#
# Apply with:
#   sudo -S microk8s kubectl patch deployment backend -n enterprise-ai-chat --patch-file k8s-force-mount.yaml --type=strategic
#
# Then restart pods:
#   sudo -S microk8s kubectl rollout restart deployment/backend -n enterprise-ai-chat

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: enterprise-ai-chat
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: STORAGE_ROOT
              value: "/app/projects"
            - name: PROJECTS_PATH
              value: "/app/projects"
            - name: EXTENSION_DIR
              value: "/app/projects/extensions"
          volumeMounts:
            - name: host-storage
              mountPath: /app/projects
      volumes:
        - name: host-storage
          hostPath:
            path: /data/shared-projects
            type: Directory
