# Kubernetes Patch to mount /data/shared-projects -> /app/projects
# Apply with: kubectl patch deployment backend -n enterprise-ai-chat --patch-file hostpath-patch.yaml
#
# This patch:
# 1. Changes the mount path from /data/projects to /app/projects
# 2. Adds STORAGE_ROOT environment variable
# 3. Uses HostPath directly for simpler setup (alternative to PVC)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: enterprise-ai-chat
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: STORAGE_ROOT
              value: "/app/projects"
          volumeMounts:
            - name: shared-projects
              mountPath: /app/projects
      volumes:
        - name: shared-projects
          hostPath:
            path: /data/shared-projects
            type: DirectoryOrCreate
