# Kubernetes HostPath Configuration for Enterprise AI Chat Backend
# Maps host folder /data/shared-projects to container folder /app/projects
#
# USAGE:
# Option 1 - Apply as patch to existing deployment:
#   kubectl patch deployment backend -n enterprise-ai-chat --patch "$(cat k8s-hostpath.yaml)"
#
# Option 2 - Apply as strategic merge patch:
#   kubectl apply -f k8s-hostpath.yaml
#
# Option 3 - Replace the entire deployment:
#   kubectl apply -f k8s/backend/deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: enterprise-ai-chat
spec:
  template:
    spec:
      volumes:
        - name: host-projects
          hostPath:
            path: /data/shared-projects    # Host path (actual storage location)
            type: DirectoryOrCreate        # Create if doesn't exist
      containers:
        - name: backend
          env:
            - name: STORAGE_ROOT
              value: "/app/projects"       # Container path
            - name: PROJECTS_PATH
              value: "/app/projects"       # Legacy compatibility
          volumeMounts:
            - name: host-projects
              mountPath: /app/projects     # Mount point inside container

---
