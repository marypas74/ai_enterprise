apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace
  namespace: enterprise-ai-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marketplace
  template:
    metadata:
      labels:
        app: marketplace
    spec:
      containers:
        - name: marketplace
          image: localhost:32000/enterprise-ai-chat/marketplace:1.0.1
          ports:
            - containerPort: 3100
          env:
            - name: PORT
              value: "3100"
            - name: DB_HOST
              value: "mariadb"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: MYSQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: MYSQL_DATABASE
            - name: QDRANT_URL
              value: "http://qdrant:6333"
            - name: MARKETPLACE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MARKETPLACE_SERVICE_TOKEN
            - name: BACKEND_INTERNAL_URL
              value: "http://backend:3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
