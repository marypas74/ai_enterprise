apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: enterprise-ai-chat
data:
  config.yaml: |
    model_list:
      # === Anthropic Claude Models ===
      - model_name: Claude Opus 4
        litellm_params:
          model: anthropic/claude-opus-4-20250514
          api_key: os.environ/ANTHROPIC_API_KEY
          max_tokens: 8192
      - model_name: Claude Sonnet 4.5
        litellm_params:
          model: anthropic/claude-sonnet-4-5-20250514
          api_key: os.environ/ANTHROPIC_API_KEY
          max_tokens: 8192
      - model_name: Claude Haiku 3.5
        litellm_params:
          model: anthropic/claude-3-5-haiku-20241022
          api_key: os.environ/ANTHROPIC_API_KEY
          max_tokens: 8192

      # === OpenAI Models ===
      - model_name: GPT-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY
      - model_name: GPT-4o Mini
        litellm_params:
          model: openai/gpt-4o-mini
          api_key: os.environ/OPENAI_API_KEY
      - model_name: o3-mini
        litellm_params:
          model: openai/o3-mini
          api_key: os.environ/OPENAI_API_KEY

      # === Ollama Local Models (via Antigravity proxy) ===
      - model_name: phi4
        litellm_params:
          model: ollama/phi4
          api_base: "http://10.0.1.1:8086/ollama"
          headers:
            X-Ollama-Key: "mTLS-k8s-backend-2026"
          request_timeout: 300
      - model_name: mistral
        litellm_params:
          model: ollama/mistral
          api_base: "http://10.0.1.1:8086/ollama"
          headers:
            X-Ollama-Key: "mTLS-k8s-backend-2026"
          request_timeout: 300
      - model_name: mixtral
        litellm_params:
          model: ollama/mixtral
          api_base: "http://10.0.1.1:8086/ollama"
          headers:
            X-Ollama-Key: "mTLS-k8s-backend-2026"
          request_timeout: 300

    general_settings:
      master_key: sk-1234
    litellm_settings:
      request_timeout: 300
      set_verbose: true
