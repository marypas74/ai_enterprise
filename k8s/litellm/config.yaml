model_list:
  - model_name: phi4
    litellm_params:
      model: ollama/phi4
      api_base: "http://10.0.1.1:8086/ollama"
      headers:
        X-Ollama-Key: "mTLS-k8s-backend-2026"
  - model_name: mistral
    litellm_params:
      model: ollama/mistral
      api_base: "http://10.0.1.1:8086/ollama"
      headers:
        X-Ollama-Key: "mTLS-k8s-backend-2026"
  - model_name: mixtral
    litellm_params:
      model: ollama/mixtral
      api_base: "http://10.0.1.1:8086/ollama"
      headers:
        X-Ollama-Key: "mTLS-k8s-backend-2026"

router_settings:
  routing_strategy: simple-shuffle
  set_verbose: false  # SECURITY: verbose logging can leak API keys and sensitive data

general_settings:
  # SECURITY: master_key is now read from LITELLM_MASTER_KEY env var (K8s secret).
  # Generate a strong key: openssl rand -hex 32
  master_key: os.environ/LITELLM_MASTER_KEY
