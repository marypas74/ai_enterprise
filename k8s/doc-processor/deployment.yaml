apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-processor
  namespace: enterprise-ai-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doc-processor
  template:
    metadata:
      labels:
        app: doc-processor
    spec:
      containers:
        - name: doc-processor
          image: localhost:32000/doc-processor:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: doc-processor
  namespace: enterprise-ai-chat
spec:
  selector:
    app: doc-processor
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
