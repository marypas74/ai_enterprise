apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: parlant-data-pvc
  namespace: enterprise-ai-chat
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: parlant-secrets
  namespace: enterprise-ai-chat
type: Opaque
stringData:
  # These will be populated from the main AI provider settings
  openai-api-key: ""
  anthropic-api-key: ""
