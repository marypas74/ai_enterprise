apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: enterprise-ai-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: localhost:32000/enterprise-ai-chat-backend:1.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: MYSQL_PASSWORD
            - name: STORAGE_ROOT
              value: "/app/projects"
            - name: PROJECTS_PATH
              value: "/app/projects"
            - name: EXTENSION_DIR
              value: "/app/projects/extensions"
            - name: ALLOWED_COUNTRIES
              value: "IT,US"
            - name: ATTACHMENTS_ROOT
              value: "/app/projects/attachments"
            - name: DOC_PROCESSOR_URL
              value: "http://doc-processor:3001"
            - name: QDRANT_URL
              value: "http://qdrant:6333"
            - name: BROWSERLESS_URL
              value: "http://browserless:3100"
          volumeMounts:
            - name: shared-projects
              mountPath: /app/projects
            - name: ollama-certs
              mountPath: /app/ollama-certs
              readOnly: true
            - name: nvidia-smi
              mountPath: /usr/bin/nvidia-smi
              readOnly: true
            - name: nvidia-libs
              mountPath: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1
              readOnly: true
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          securityContext:
            privileged: false
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: shared-projects
          hostPath:
            path: /data/shared-projects
            type: DirectoryOrCreate
        - name: ollama-certs
          secret:
            secretName: ollama-mtls-certs
        - name: nvidia-smi
          hostPath:
            path: /usr/bin/nvidia-smi
        - name: nvidia-libs
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mariadb 3306; do
                echo "Waiting for MariaDB..."
                sleep 2
              done
              echo "MariaDB is ready"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: enterprise-ai-chat
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
