apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: enterprise-ai-chat
type: Opaque
stringData:
  # IMPORTANT: Replace ALL values below before deploying!
  # Generate secrets with: openssl rand -base64 32
  # Do NOT commit real secrets to git.

  # Database
  DB_PASSWORD: "REPLACE_WITH_REAL_DB_PASSWORD"

  # JWT — generate with: openssl rand -base64 64
  JWT_SECRET: "REPLACE_WITH_REAL_JWT_SECRET"

  # Encryption key for provider API keys — generate with: openssl rand -base64 32
  ENCRYPTION_KEY: "REPLACE_WITH_REAL_ENCRYPTION_KEY"

  # AI Provider API Keys (replace with your actual keys)
  OPENAI_API_KEY: "REPLACE_WITH_REAL_KEY"
  ANTHROPIC_API_KEY: "REPLACE_WITH_REAL_KEY"
  GOOGLE_AI_API_KEY: "REPLACE_WITH_REAL_KEY"

---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secrets
  namespace: enterprise-ai-chat
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "REPLACE_WITH_REAL_ROOT_PASSWORD"
  MYSQL_DATABASE: "enterprise_ai_chat"
  MYSQL_USER: "enterprise_ai"
  MYSQL_PASSWORD: "REPLACE_WITH_REAL_DB_PASSWORD"
