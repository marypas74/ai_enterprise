apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: enterprise-ai-chat
type: Opaque
stringData:
  # IMPORTANT: Replace ALL values below before deploying!
  # Generate secrets with: openssl rand -base64 32
  # Do NOT commit real secrets to git.

  # Database
  DB_PASSWORD: "change-me-in-production"

  # JWT — generate with: openssl rand -base64 64
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"

  # Encryption key for provider API keys — generate with: openssl rand -base64 32
  ENCRYPTION_KEY: "UkVQTEFDRV9XSVRIX1JFQUxfRU5DUllQVElPTl9LRVk="

  # AI Provider API Keys (replace with your actual keys)
  OPENAI_API_KEY: "change-me-in-production"
  ANTHROPIC_API_KEY: "change-me-in-production"
  GOOGLE_AI_API_KEY: "change-me-in-production"

---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secrets
  namespace: enterprise-ai-chat
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root-password-change-me"
  MYSQL_DATABASE: "enterprise_ai_chat"
  MYSQL_USER: "enterprise_ai"
  MYSQL_PASSWORD: "change-me-in-production"
