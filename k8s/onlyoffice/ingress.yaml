apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onlyoffice-ingress
  namespace: enterprise-ai-chat
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$arg_doc"
    # Rewrite /onlyoffice/ -> / for OnlyOffice backend
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Set X-Forwarded-Prefix so OnlyOffice generates correct URLs with /onlyoffice prefix
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Prefix /onlyoffice;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: public
  tls:
    - hosts:
        - plane.lushlolli.com
      secretName: enterprise-ai-chat-tls
  rules:
    - host: plane.lushlolli.com
      http:
        paths:
          - path: /onlyoffice(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: onlyoffice
                port:
                  number: 80
---
# Separate ingress for /cache/files/ - OnlyOffice generates these URLs without the /onlyoffice prefix
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onlyoffice-cache-ingress
  namespace: enterprise-ai-chat
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: public
  tls:
    - hosts:
        - plane.lushlolli.com
      secretName: enterprise-ai-chat-tls
  rules:
    - host: plane.lushlolli.com
      http:
        paths:
          - path: /cache/files
            pathType: Prefix
            backend:
              service:
                name: onlyoffice
                port:
                  number: 80
