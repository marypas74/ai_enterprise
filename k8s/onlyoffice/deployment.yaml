apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  namespace: enterprise-ai-chat
  labels:
    app: onlyoffice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onlyoffice
  template:
    metadata:
      labels:
        app: onlyoffice
    spec:
      containers:
        - name: onlyoffice
          image: onlyoffice/documentserver:8.3
          ports:
            - containerPort: 80
              name: http
          env:
            - name: JWT_ENABLED
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ONLYOFFICE_JWT_SECRET
            - name: JWT_HEADER
              value: "Authorization"
            - name: JWT_IN_BODY
              value: "true"
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: onlyoffice-data
              mountPath: /var/lib/onlyoffice
      volumes:
        - name: onlyoffice-data
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: onlyoffice
  namespace: enterprise-ai-chat
  labels:
    app: onlyoffice
spec:
  selector:
    app: onlyoffice
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP
