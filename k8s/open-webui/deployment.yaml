apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: enterprise-ai-chat
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.5.17
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_BASE_URL
              value: "http://litellm.enterprise-ai-chat.svc.cluster.local:4000/v1"
            - name: OPENAI_API_KEY
              value: "sk-1234"
            - name: OLLAMA_BASE_URL
              value: ""
            - name: WEBUI_SECRET_KEY
              value: "changeme-generated-secure-key"
            - name: ENABLE_RAG_WEB_SEARCH
              value: "true"
            - name: RAG_WEB_SEARCH_ENGINE
              value: "duckduckgo"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-pvc
