apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-backup
  namespace: enterprise-ai-chat
spec:
  schedule: "0 2 * * *"  # Daily at 2:00 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: mariadb:11.4
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/enterprise_ai_chat_${TIMESTAMP}.sql.gz"

                  echo "[$(date)] Starting backup..."
                  mariadb-dump \
                    --host=mariadb \
                    --user=root \
                    --password="${MYSQL_ROOT_PASSWORD}" \
                    --single-transaction \
                    --routines \
                    --triggers \
                    --events \
                    --all-databases | gzip > "${BACKUP_FILE}"

                  FILESIZE=$(stat -c%s "${BACKUP_FILE}")
                  echo "[$(date)] Backup completed: ${BACKUP_FILE} (${FILESIZE} bytes)"

                  # Retention: keep last 30 days
                  echo "[$(date)] Cleaning old backups (>30 days)..."
                  find /backups -name "*.sql.gz" -mtime +30 -delete

                  REMAINING=$(ls -1 /backups/*.sql.gz 2>/dev/null | wc -l)
                  echo "[$(date)] Backup retention: ${REMAINING} backups stored"
              env:
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mariadb-secrets
                      key: MYSQL_ROOT_PASSWORD
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              hostPath:
                path: /data/mariadb-backups
                type: DirectoryOrCreate
