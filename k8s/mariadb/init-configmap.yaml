apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-init
  namespace: enterprise-ai-chat
data:
  init.sql: |
    -- Enterprise AI Chat - Database Schema
    -- MariaDB 10.11+
    
    CREATE DATABASE IF NOT EXISTS enterprise_ai_chat
        CHARACTER SET utf8mb4
        COLLATE utf8mb4_unicode_ci;
    
    USE enterprise_ai_chat;
    
    -- ============================================
    -- USERS & AUTHENTICATION
    -- ============================================
    
    CREATE TABLE users (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        email VARCHAR(255) NOT NULL UNIQUE,
        password_hash VARCHAR(255) NOT NULL,
        name VARCHAR(100) NOT NULL,
        role ENUM('admin', 'user') DEFAULT 'user',
        is_active BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        last_login_at TIMESTAMP NULL,
        INDEX idx_email (email),
        INDEX idx_role (role),
        INDEX idx_is_active (is_active)
    ) ENGINE=InnoDB;
    
    CREATE TABLE refresh_tokens (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        user_id BIGINT UNSIGNED NOT NULL,
        token_hash VARCHAR(255) NOT NULL UNIQUE,
        expires_at TIMESTAMP NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        revoked_at TIMESTAMP NULL,
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        INDEX idx_token_hash (token_hash),
        INDEX idx_expires_at (expires_at)
    ) ENGINE=InnoDB;
    
    -- ============================================
    -- GROUPS & PERMISSIONS
    -- ============================================
    
    CREATE TABLE `groups` (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL UNIQUE,
        description TEXT,
        max_tokens_per_month BIGINT UNSIGNED DEFAULT 1000000,
        allowed_models JSON,
        kanban_enabled BOOLEAN DEFAULT FALSE,
        is_active BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        INDEX idx_name (name),
        INDEX idx_is_active (is_active)
    ) ENGINE=InnoDB;
    
    CREATE TABLE user_groups (
        user_id BIGINT UNSIGNED NOT NULL,
        group_id BIGINT UNSIGNED NOT NULL,
        joined_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (user_id, group_id),
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        FOREIGN KEY (group_id) REFERENCES `groups`(id) ON DELETE CASCADE
    ) ENGINE=InnoDB;
    
    -- ============================================
    -- AI PROVIDERS & MODELS CONFIGURATION
    -- ============================================
    
    -- Provider configurations (OpenAI, Anthropic, Google, Ollama, etc.)
    CREATE TABLE ai_providers (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(50) NOT NULL UNIQUE,
        display_name VARCHAR(100) NOT NULL,
        provider_type ENUM('openai', 'anthropic', 'google', 'ollama', 'custom') NOT NULL,
        is_enabled BOOLEAN DEFAULT FALSE,
        is_local BOOLEAN DEFAULT FALSE,
        config_schema JSON NOT NULL, -- JSON Schema for dynamic form generation
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        INDEX idx_provider_type (provider_type),
        INDEX idx_is_enabled (is_enabled)
    ) ENGINE=InnoDB;
    
    -- Provider settings (API keys, endpoints, etc.) - encrypted sensitive data
    CREATE TABLE ai_provider_settings (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        provider_id BIGINT UNSIGNED NOT NULL,
        setting_key VARCHAR(100) NOT NULL,
        setting_value TEXT, -- Encrypted for sensitive values
        is_secret BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        UNIQUE KEY uk_provider_setting (provider_id, setting_key),
        FOREIGN KEY (provider_id) REFERENCES ai_providers(id) ON DELETE CASCADE
    ) ENGINE=InnoDB;
    
    -- Available AI models
    CREATE TABLE ai_models (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        provider_id BIGINT UNSIGNED NOT NULL,
        model_id VARCHAR(100) NOT NULL, -- e.g., gpt-4, claude-3-opus
        display_name VARCHAR(150) NOT NULL,
        description TEXT,
        model_type ENUM('chat', 'completion', 'embedding', 'image', 'audio') DEFAULT 'chat',
        context_window INT UNSIGNED DEFAULT 4096,
        max_output_tokens INT UNSIGNED DEFAULT 4096,
        input_cost_per_1k DECIMAL(10, 6) DEFAULT 0, -- Cost per 1000 input tokens
        output_cost_per_1k DECIMAL(10, 6) DEFAULT 0, -- Cost per 1000 output tokens
        supports_streaming BOOLEAN DEFAULT TRUE,
        supports_functions BOOLEAN DEFAULT FALSE,
        supports_vision BOOLEAN DEFAULT FALSE,
        is_enabled BOOLEAN DEFAULT TRUE,
        is_default BOOLEAN DEFAULT FALSE,
        sort_order INT DEFAULT 0,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        UNIQUE KEY uk_provider_model (provider_id, model_id),
        FOREIGN KEY (provider_id) REFERENCES ai_providers(id) ON DELETE CASCADE,
        INDEX idx_model_type (model_type),
        INDEX idx_is_enabled (is_enabled)
    ) ENGINE=InnoDB;
    
    -- Group model permissions (which models each group can use)
    CREATE TABLE group_model_permissions (
        group_id BIGINT UNSIGNED NOT NULL,
        model_id BIGINT UNSIGNED NOT NULL,
        max_tokens_per_request INT UNSIGNED DEFAULT 4096,
        max_requests_per_day INT UNSIGNED DEFAULT 1000,
        is_allowed BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (group_id, model_id),
        FOREIGN KEY (group_id) REFERENCES `groups`(id) ON DELETE CASCADE,
        FOREIGN KEY (model_id) REFERENCES ai_models(id) ON DELETE CASCADE
    ) ENGINE=InnoDB;
    
    -- System settings (global configuration)
    CREATE TABLE system_settings (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        setting_key VARCHAR(100) NOT NULL UNIQUE,
        setting_value TEXT,
        setting_type ENUM('string', 'number', 'boolean', 'json') DEFAULT 'string',
        description TEXT,
        is_public BOOLEAN DEFAULT FALSE, -- Can be read by non-admin users
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    ) ENGINE=InnoDB;
    
    -- ============================================
    -- CONVERSATIONS & MESSAGES
    -- ============================================
    
    CREATE TABLE conversations (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        user_id BIGINT UNSIGNED NOT NULL,
        title VARCHAR(255),
        model VARCHAR(50) NOT NULL,
        provider ENUM('openai', 'anthropic', 'google', 'ollama', 'custom') NOT NULL,
        system_prompt TEXT,
        is_archived BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        INDEX idx_user_id (user_id),
        INDEX idx_created_at (created_at),
        INDEX idx_is_archived (is_archived)
    ) ENGINE=InnoDB;
    
    CREATE TABLE messages (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        conversation_id BIGINT UNSIGNED NOT NULL,
        role ENUM('system', 'user', 'assistant') NOT NULL,
        content TEXT NOT NULL,
        tokens_input INT UNSIGNED DEFAULT 0,
        tokens_output INT UNSIGNED DEFAULT 0,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (conversation_id) REFERENCES conversations(id) ON DELETE CASCADE,
        INDEX idx_conversation_id (conversation_id),
        INDEX idx_created_at (created_at)
    ) ENGINE=InnoDB;
    
    -- ============================================
    -- TOKEN USAGE & COSTS
    -- ============================================
    
    CREATE TABLE token_usage (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        user_id BIGINT UNSIGNED NOT NULL,
        conversation_id BIGINT UNSIGNED,
        provider ENUM('openai', 'anthropic', 'google', 'ollama', 'custom') NOT NULL,
        model VARCHAR(50) NOT NULL,
        tokens_input INT UNSIGNED NOT NULL,
        tokens_output INT UNSIGNED NOT NULL,
        cost_usd DECIMAL(10, 6) DEFAULT 0,
        recorded_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        FOREIGN KEY (conversation_id) REFERENCES conversations(id) ON DELETE SET NULL,
        INDEX idx_user_id (user_id),
        INDEX idx_provider (provider),
        INDEX idx_recorded_at (recorded_at)
    ) ENGINE=InnoDB;
    
    -- Monthly usage summary (for quick queries)
    CREATE TABLE monthly_usage (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        user_id BIGINT UNSIGNED NOT NULL,
        `year_month` CHAR(7) NOT NULL, -- YYYY-MM format
        provider ENUM('openai', 'anthropic', 'google', 'ollama', 'custom') NOT NULL,
        total_tokens_input BIGINT UNSIGNED DEFAULT 0,
        total_tokens_output BIGINT UNSIGNED DEFAULT 0,
        total_cost_usd DECIMAL(12, 6) DEFAULT 0,
        request_count INT UNSIGNED DEFAULT 0,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        UNIQUE KEY uk_user_month_provider (user_id, `year_month`, provider),
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        INDEX idx_year_month (`year_month`)
    ) ENGINE=InnoDB;
    
    -- ============================================
    -- AUDIT LOG
    -- ============================================
    
    CREATE TABLE audit_log (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        user_id BIGINT UNSIGNED,
        action VARCHAR(50) NOT NULL,
        entity_type VARCHAR(50),
        entity_id BIGINT UNSIGNED,
        details JSON,
        ip_address VARCHAR(45),
        user_agent TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE SET NULL,
        INDEX idx_user_id (user_id),
        INDEX idx_action (action),
        INDEX idx_entity_type (entity_type),
        INDEX idx_created_at (created_at)
    ) ENGINE=InnoDB;
    
    -- ============================================
    -- ACTIVITY LOG (extension monitoring)
    -- ============================================
    
    CREATE TABLE activity_log (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        user_id BIGINT UNSIGNED NOT NULL,
        action VARCHAR(100) NOT NULL,
        details JSON,
        source VARCHAR(50) DEFAULT 'vscode-extension',
        ip_address VARCHAR(45),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        INDEX idx_user_id (user_id),
        INDEX idx_action (action),
        INDEX idx_source (source),
        INDEX idx_created_at (created_at)
    ) ENGINE=InnoDB;
    
    -- ============================================
    -- API KEYS (for external integrations)
    -- ============================================
    
    CREATE TABLE api_keys (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        user_id BIGINT UNSIGNED NOT NULL,
        name VARCHAR(100) NOT NULL,
        key_hash VARCHAR(255) NOT NULL UNIQUE,
        key_prefix VARCHAR(8) NOT NULL, -- First 8 chars for identification
        permissions JSON,
        last_used_at TIMESTAMP NULL,
        expires_at TIMESTAMP NULL,
        is_active BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        INDEX idx_key_hash (key_hash),
        INDEX idx_user_id (user_id)
    ) ENGINE=InnoDB;
    
    -- ============================================
    -- SKILLS & PLUGINS MANAGEMENT
    -- ============================================
    
    -- Plugin registry (available plugins)
    CREATE TABLE plugins (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL UNIQUE,
        display_name VARCHAR(200) NOT NULL,
        description TEXT,
        version VARCHAR(20) NOT NULL,
        author VARCHAR(100),
        category ENUM('tools', 'integrations', 'utilities', 'ai', 'data', 'other') DEFAULT 'other',
        icon VARCHAR(100),
        config_schema JSON, -- JSON Schema for plugin settings
        is_system BOOLEAN DEFAULT FALSE, -- System plugins can't be disabled
        is_enabled BOOLEAN DEFAULT TRUE,
        install_path TEXT,
        entry_point VARCHAR(255), -- Main module/file
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        INDEX idx_category (category),
        INDEX idx_is_enabled (is_enabled)
    ) ENGINE=InnoDB;
    
    -- Plugin settings (global and per-user)
    CREATE TABLE plugin_settings (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        plugin_id BIGINT UNSIGNED NOT NULL,
        user_id BIGINT UNSIGNED NULL, -- NULL = global setting
        setting_key VARCHAR(100) NOT NULL,
        setting_value TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        UNIQUE KEY uk_plugin_user_key (plugin_id, user_id, setting_key),
        FOREIGN KEY (plugin_id) REFERENCES plugins(id) ON DELETE CASCADE,
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
    ) ENGINE=InnoDB;
    
    -- User plugin permissions
    CREATE TABLE user_plugin_permissions (
        user_id BIGINT UNSIGNED NOT NULL,
        plugin_id BIGINT UNSIGNED NOT NULL,
        is_enabled BOOLEAN DEFAULT TRUE,
        settings_override JSON, -- User-specific settings override
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (user_id, plugin_id),
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        FOREIGN KEY (plugin_id) REFERENCES plugins(id) ON DELETE CASCADE
    ) ENGINE=InnoDB;
    
    -- MCP (Model Context Protocol) Servers
    CREATE TABLE mcp_servers (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL UNIQUE,
        display_name VARCHAR(200) NOT NULL,
        description TEXT,
        transport_type ENUM('stdio', 'sse', 'websocket') DEFAULT 'stdio',
        command TEXT, -- Command to run for stdio transport
        url TEXT, -- URL for SSE/WebSocket transport
        env_vars JSON, -- Environment variables
        is_enabled BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        INDEX idx_is_enabled (is_enabled)
    ) ENGINE=InnoDB;
    
    -- MCP Server user permissions
    CREATE TABLE user_mcp_permissions (
        user_id BIGINT UNSIGNED NOT NULL,
        mcp_server_id BIGINT UNSIGNED NOT NULL,
        is_enabled BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (user_id, mcp_server_id),
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        FOREIGN KEY (mcp_server_id) REFERENCES mcp_servers(id) ON DELETE CASCADE
    ) ENGINE=InnoDB;
    
    -- Skills (AI capabilities per user)
    CREATE TABLE skills (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL UNIQUE,
        display_name VARCHAR(200) NOT NULL,
        description TEXT,
        category ENUM('coding', 'writing', 'analysis', 'research', 'creative', 'technical', 'communication', 'other') DEFAULT 'other',
        system_prompt TEXT, -- Additional system prompt for this skill
        example_prompts JSON, -- Example prompts to show users
        required_tools JSON, -- Tools/plugins required for this skill
        is_default BOOLEAN DEFAULT FALSE, -- Enabled by default for new users
        is_active BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        INDEX idx_category (category),
        INDEX idx_is_active (is_active)
    ) ENGINE=InnoDB;
    
    -- User skill assignments
    CREATE TABLE user_skills (
        user_id BIGINT UNSIGNED NOT NULL,
        skill_id BIGINT UNSIGNED NOT NULL,
        is_enabled BOOLEAN DEFAULT TRUE,
        proficiency_level ENUM('beginner', 'intermediate', 'advanced', 'expert') DEFAULT 'intermediate',
        custom_prompt_addition TEXT, -- User's custom addition to skill prompt
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        PRIMARY KEY (user_id, skill_id),
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        FOREIGN KEY (skill_id) REFERENCES skills(id) ON DELETE CASCADE
    ) ENGINE=InnoDB;
    
    -- Skill templates (pre-configured skill sets)
    CREATE TABLE skill_templates (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL UNIQUE,
        display_name VARCHAR(200) NOT NULL,
        description TEXT,
        skill_ids JSON, -- Array of skill IDs
        is_active BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    ) ENGINE=InnoDB;
    
    -- Tool definitions (function calling capabilities)
    CREATE TABLE tools (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        plugin_id BIGINT UNSIGNED NULL, -- Associated plugin (if any)
        name VARCHAR(100) NOT NULL UNIQUE,
        display_name VARCHAR(200) NOT NULL,
        description TEXT,
        tool_type ENUM('function', 'api', 'mcp', 'system') DEFAULT 'function',
        input_schema JSON NOT NULL, -- JSON Schema for tool input
        output_schema JSON, -- JSON Schema for tool output
        handler_config JSON, -- Configuration for how to execute the tool
        requires_approval BOOLEAN DEFAULT FALSE, -- Requires user approval before execution
        is_enabled BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        FOREIGN KEY (plugin_id) REFERENCES plugins(id) ON DELETE SET NULL,
        INDEX idx_tool_type (tool_type),
        INDEX idx_is_enabled (is_enabled)
    ) ENGINE=InnoDB;
    
    -- User tool permissions
    CREATE TABLE user_tool_permissions (
        user_id BIGINT UNSIGNED NOT NULL,
        tool_id BIGINT UNSIGNED NOT NULL,
        is_enabled BOOLEAN DEFAULT TRUE,
        auto_approve BOOLEAN DEFAULT FALSE, -- Skip approval for this user
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (user_id, tool_id),
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        FOREIGN KEY (tool_id) REFERENCES tools(id) ON DELETE CASCADE
    ) ENGINE=InnoDB;
    
    -- Tool execution log
    CREATE TABLE tool_executions (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        user_id BIGINT UNSIGNED NOT NULL,
        tool_id BIGINT UNSIGNED NOT NULL,
        conversation_id BIGINT UNSIGNED NULL,
        input_data JSON,
        output_data JSON,
        status ENUM('pending', 'approved', 'rejected', 'running', 'success', 'error') DEFAULT 'pending',
        error_message TEXT,
        execution_time_ms INT UNSIGNED,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        completed_at TIMESTAMP NULL,
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        FOREIGN KEY (tool_id) REFERENCES tools(id) ON DELETE CASCADE,
        FOREIGN KEY (conversation_id) REFERENCES conversations(id) ON DELETE SET NULL,
        INDEX idx_user_id (user_id),
        INDEX idx_status (status),
        INDEX idx_created_at (created_at)
    ) ENGINE=InnoDB;
    
    -- ============================================
    -- KANBAN / PROJECT MANAGEMENT
    -- ============================================
    
    -- Projects
    CREATE TABLE projects (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(200) NOT NULL,
        description TEXT,
        owner_id BIGINT UNSIGNED NOT NULL,
        color VARCHAR(7) DEFAULT '#3B82F6', -- Hex color
        icon VARCHAR(50) DEFAULT 'folder',
        is_archived BOOLEAN DEFAULT FALSE,
        is_public BOOLEAN DEFAULT FALSE, -- Visible to all users in same groups
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        FOREIGN KEY (owner_id) REFERENCES users(id) ON DELETE CASCADE,
        INDEX idx_owner_id (owner_id),
        INDEX idx_is_archived (is_archived)
    ) ENGINE=InnoDB;
    
    -- Project members
    CREATE TABLE project_members (
        project_id BIGINT UNSIGNED NOT NULL,
        user_id BIGINT UNSIGNED NOT NULL,
        role ENUM('viewer', 'member', 'admin') DEFAULT 'member',
        joined_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (project_id, user_id),
        FOREIGN KEY (project_id) REFERENCES projects(id) ON DELETE CASCADE,
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
    ) ENGINE=InnoDB;
    
    -- Kanban boards (a project can have multiple boards)
    CREATE TABLE kanban_boards (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        project_id BIGINT UNSIGNED NOT NULL,
        name VARCHAR(200) NOT NULL,
        description TEXT,
        is_default BOOLEAN DEFAULT FALSE,
        sort_order INT DEFAULT 0,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        FOREIGN KEY (project_id) REFERENCES projects(id) ON DELETE CASCADE,
        INDEX idx_project_id (project_id)
    ) ENGINE=InnoDB;
    
    -- Kanban columns (e.g., To Do, In Progress, Done)
    CREATE TABLE kanban_columns (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        board_id BIGINT UNSIGNED NOT NULL,
        name VARCHAR(100) NOT NULL,
        color VARCHAR(7) DEFAULT '#6B7280',
        wip_limit INT UNSIGNED DEFAULT 0, -- Work-in-progress limit (0 = no limit)
        sort_order INT DEFAULT 0,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        FOREIGN KEY (board_id) REFERENCES kanban_boards(id) ON DELETE CASCADE,
        INDEX idx_board_id (board_id)
    ) ENGINE=InnoDB;
    
    -- Kanban cards (tasks/items)
    CREATE TABLE kanban_cards (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        column_id BIGINT UNSIGNED NOT NULL,
        title VARCHAR(500) NOT NULL,
        description TEXT,
        priority ENUM('low', 'medium', 'high', 'urgent') DEFAULT 'medium',
        due_date DATE NULL,
        estimated_hours DECIMAL(5,2) DEFAULT 0,
        actual_hours DECIMAL(5,2) DEFAULT 0,
        cover_color VARCHAR(7) NULL, -- Card header color
        cover_image_url TEXT NULL,
        created_by BIGINT UNSIGNED NOT NULL,
        assigned_to BIGINT UNSIGNED NULL,
        sort_order INT DEFAULT 0,
        is_archived BOOLEAN DEFAULT FALSE,
        completed_at TIMESTAMP NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        FOREIGN KEY (column_id) REFERENCES kanban_columns(id) ON DELETE CASCADE,
        FOREIGN KEY (created_by) REFERENCES users(id) ON DELETE CASCADE,
        FOREIGN KEY (assigned_to) REFERENCES users(id) ON DELETE SET NULL,
        INDEX idx_column_id (column_id),
        INDEX idx_assigned_to (assigned_to),
        INDEX idx_priority (priority),
        INDEX idx_due_date (due_date),
        INDEX idx_is_archived (is_archived)
    ) ENGINE=InnoDB;
    
    -- Card labels/tags
    CREATE TABLE kanban_labels (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        project_id BIGINT UNSIGNED NOT NULL,
        name VARCHAR(50) NOT NULL,
        color VARCHAR(7) NOT NULL DEFAULT '#3B82F6',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (project_id) REFERENCES projects(id) ON DELETE CASCADE,
        UNIQUE KEY uk_project_label (project_id, name)
    ) ENGINE=InnoDB;
    
    -- Card-Label relationships
    CREATE TABLE kanban_card_labels (
        card_id BIGINT UNSIGNED NOT NULL,
        label_id BIGINT UNSIGNED NOT NULL,
        PRIMARY KEY (card_id, label_id),
        FOREIGN KEY (card_id) REFERENCES kanban_cards(id) ON DELETE CASCADE,
        FOREIGN KEY (label_id) REFERENCES kanban_labels(id) ON DELETE CASCADE
    ) ENGINE=InnoDB;
    
    -- Card comments
    CREATE TABLE kanban_card_comments (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        card_id BIGINT UNSIGNED NOT NULL,
        user_id BIGINT UNSIGNED NOT NULL,
        content TEXT NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        FOREIGN KEY (card_id) REFERENCES kanban_cards(id) ON DELETE CASCADE,
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        INDEX idx_card_id (card_id)
    ) ENGINE=InnoDB;
    
    -- Card attachments
    CREATE TABLE kanban_card_attachments (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        card_id BIGINT UNSIGNED NOT NULL,
        user_id BIGINT UNSIGNED NOT NULL,
        file_name VARCHAR(255) NOT NULL,
        file_path TEXT NOT NULL,
        file_size BIGINT UNSIGNED NOT NULL,
        mime_type VARCHAR(100),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (card_id) REFERENCES kanban_cards(id) ON DELETE CASCADE,
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        INDEX idx_card_id (card_id)
    ) ENGINE=InnoDB;
    
    -- Card checklists
    CREATE TABLE kanban_checklists (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        card_id BIGINT UNSIGNED NOT NULL,
        name VARCHAR(200) NOT NULL,
        sort_order INT DEFAULT 0,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (card_id) REFERENCES kanban_cards(id) ON DELETE CASCADE,
        INDEX idx_card_id (card_id)
    ) ENGINE=InnoDB;
    
    -- Checklist items
    CREATE TABLE kanban_checklist_items (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        checklist_id BIGINT UNSIGNED NOT NULL,
        content VARCHAR(500) NOT NULL,
        is_checked BOOLEAN DEFAULT FALSE,
        sort_order INT DEFAULT 0,
        checked_by BIGINT UNSIGNED NULL,
        checked_at TIMESTAMP NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (checklist_id) REFERENCES kanban_checklists(id) ON DELETE CASCADE,
        FOREIGN KEY (checked_by) REFERENCES users(id) ON DELETE SET NULL,
        INDEX idx_checklist_id (checklist_id)
    ) ENGINE=InnoDB;
    
    -- Card activity log
    CREATE TABLE kanban_card_activity (
        id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        card_id BIGINT UNSIGNED NOT NULL,
        user_id BIGINT UNSIGNED NOT NULL,
        action VARCHAR(50) NOT NULL, -- created, moved, assigned, commented, etc.
        details JSON,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (card_id) REFERENCES kanban_cards(id) ON DELETE CASCADE,
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        INDEX idx_card_id (card_id),
        INDEX idx_created_at (created_at)
    ) ENGINE=InnoDB;
    
    -- Link conversations to cards (AI-assisted project management)
    CREATE TABLE kanban_card_conversations (
        card_id BIGINT UNSIGNED NOT NULL,
        conversation_id BIGINT UNSIGNED NOT NULL,
        linked_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (card_id, conversation_id),
        FOREIGN KEY (card_id) REFERENCES kanban_cards(id) ON DELETE CASCADE,
        FOREIGN KEY (conversation_id) REFERENCES conversations(id) ON DELETE CASCADE
    ) ENGINE=InnoDB;
    
