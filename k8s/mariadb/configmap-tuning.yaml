apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-tuning
  namespace: enterprise-ai-chat
data:
  perf-79.cnf: |
    # PERF-79-C: MariaDB performance tuning
    # Applicato in v2.1.79

    [mysqld]
    # Buffer pool: 1G per ridurre I/O su tabelle calde
    innodb_buffer_pool_size = 1G

    # Slow query log per identificare query lente
    slow_query_log = ON
    slow_query_log_file = /var/log/mysql/slow.log
    long_query_time = 1.0

    # Connection tuning
    max_connections = 300
    wait_timeout = 600
    interactive_timeout = 600
