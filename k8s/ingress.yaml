apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-ai-chat
  namespace: enterprise-ai-chat
  annotations:
    # Nginx Ingress annotations
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # SSE support for streaming
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-rpm: "300"
    # SSL redirect disabled — Cloudflare handles TLS termination
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    # NOTE: whitelist-source-range removed — incompatible with Cloudflare Tunnel
    # (all requests arrive from ::1/localhost). IP restriction is handled at
    # application level by reading the CF-Connecting-IP header.
spec:
  ingressClassName: public
  tls:
    - hosts:
        - plane.lushlolli.com
      secretName: enterprise-ai-chat-tls
  rules:
    - host: plane.lushlolli.com
      http:
        paths:
          # API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          # Frontend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
