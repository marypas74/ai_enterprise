apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enterprise-ai-chat

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - mariadb/statefulset.yaml
  - redis/statefulset.yaml
  - backend/deployment.yaml
  - frontend/deployment.yaml
  - qdrant/statefulset.yaml
  - browserless/deployment.yaml
  - ingress.yaml

# NOTE: commonLabels removed — it injects labels into Service selectors,
# breaking selector matching when pods don't have the same labels.
# Use metadata labels directly in each resource instead.
commonAnnotations:
  app.kubernetes.io/version: "2.1.20"
