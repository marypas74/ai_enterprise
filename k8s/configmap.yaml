apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: enterprise-ai-chat
data:
  # Server
  PORT: "3000"
  HOST: "0.0.0.0"
  NODE_ENV: "production"

  # Database
  DB_HOST: "mariadb"
  DB_PORT: "3306"
  DB_NAME: "enterprise_ai_chat"
  DB_USER: "enterprise_ai"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # JWT
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"

  # Rate Limiting
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW_MS: "60000"

  # CORS - Update with your domain (comma-separated for multiple origins)
  CORS_ORIGIN: "https://plane.lushlolli.com,https://localhost,capacitor://localhost"

  # Ollama (external Docker container on host, HTTP + header auth)
  OLLAMA_BASE_URL: "http://10.0.1.1:8086/ollama"
  OLLAMA_AUTH_KEY: "mTLS-k8s-backend-2026"

  # vLLM (external Docker container on host, OpenAI-compatible API)
  VLLM_BASE_URL: "http://10.0.1.1:8087/vllm"
  VLLM_AUTH_KEY: "mTLS-k8s-backend-2026"
  VLLM_API_KEY: "vllm-local-2026"

  # Inference mode: vllm (primary provider, Ollama retained for vision/embedding only)
  INFERENCE_MODE: "vllm"

  # Public metrics — allowed IPs (comma-separated)
  METRICS_ALLOWED_IPS: "217.198.133.248"
